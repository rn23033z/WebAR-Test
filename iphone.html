<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPhone版 WebAR</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body style="margin: 0; background-color: #f0f0f0;">

  <model-viewer 
    src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
    ios-src="https://modelviewer.dev/shared-assets/models/Astronaut.usdz"
    alt="宇宙飛行士の3Dモデル"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    shadow-intensity="1"
    style="width: 100vw; height: 100vh;">
    
    <button slot="ar-button" style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); padding: 12px 24px; background-color: #000; color: white; border: none; border-radius: 20px; font-size: 16px; font-weight: bold; cursor: pointer;">
      ARでカメラを起動 (iPhone対応)
    </button>
  </model-viewer>

</body>
</html>
