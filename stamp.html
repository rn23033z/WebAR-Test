<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ARデジタルスタンプラリー</title>

  <!-- A-Frame と AR.js -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      user-select: none;
    }

    /* === 1. メイン画面（スタンプ一覧） === */
    #main-screen {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #f4f6f9;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
      box-sizing: border-box;
      overflow-y: auto;
    }
    h1 { margin-bottom: 5px; color: #333; font-size: 22px; }
    p.sub { color: #666; font-size: 14px; margin-bottom: 25px; }

    /* スタンプ一覧のグリッド */
    .stamp-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      width: 100%;
      max-width: 320px;
      margin-bottom: 30px;
    }
    .stamp-card {
      background: white;
      border-radius: 15px;
      padding: 15px 10px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      border: 2px dashed #ccc;
    }
    .stamp-card.got {
      border: 2px solid #ff9800;
      background: #fffdf8;
    }
    
    /* スタンプ画像枠 */
    .stamp-img-container {
      width: 70px;
      height: 70px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stamp-card-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: grayscale(100%);
      opacity: 0.2; /* 未獲得時は白黒＆薄く表示 */
    }
    .stamp-card.got .stamp-card-img {
      filter: grayscale(0%);
      opacity: 1; /* 獲得済みでカラー表示 */
    }
    .stamp-name { font-size: 14px; font-weight: bold; margin-top: 8px; color: #444; }

    /* ボタンデザイン */
    .btn-start {
      background: #ff9800; color: white; border: none;
      padding: 15px 40px; font-size: 18px; font-weight: bold;
      border-radius: 30px; box-shadow: 0 4px 12px rgba(255,152,0,0.4);
      cursor: pointer;
    }

    /* === 2. AR画面のオーバーレイUI === */
    #ar-ui {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 10;
      pointer-events: none;
      display: none;
    }

    /* 戻るボタン */
    .btn-back {
      position: absolute; top: 20px; left: 20px;
      background: rgba(0,0,0,0.6); color: white; border: none;
      padding: 10px 18px; font-size: 14px; font-weight: bold;
      border-radius: 20px; pointer-events: auto; cursor: pointer;
    }

    /* 円形プログレスメーター */
    #progress-container {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 120px; height: 120px;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .svg-meter { transform: rotate(-90deg); width: 100px; height: 100px; }
    .meter-bg { fill: none; stroke: rgba(255,255,255,0.3); stroke-width: 8; }
    .meter-bar {
      fill: none; stroke: #ff9800; stroke-width: 8;
      stroke-dasharray: 283; stroke-dashoffset: 283;
      transition: stroke-dashoffset 0.1s linear;
    }
    .meter-text { position: absolute; color: white; font-weight: bold; font-size: 14px; }

    /* === 3. ゲット演出ポップアップ === */
    #modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.8); z-index: 50;
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      pointer-events: auto; cursor: pointer;
    }
    .modal-card {
      background: white; border-radius: 20px;
      padding: 25px; text-align: center; width: 80%; max-width: 280px;
      animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes pop {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    /* ゲット時のイラスト画像アニメーション */
    .modal-img {
      width: 110px; height: 110px;
      object-fit: contain;
      margin-bottom: 10px;
      animation: bounce 0.6s ease infinite alternate;
    }
    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-10px); }
    }
    .modal-title { font-size: 20px; font-weight: bold; color: #ff9800; }
    .modal-sub { font-size: 12px; color: #888; margin-top: 15px; }
  </style>
</head>
<body>

  <!-- 1. メイン画面（スタンプ台紙） -->
  <div id="main-screen">
    <h1>ARスタンプラリー</h1>
    <p class="sub">マーカーを探してカメラでかざそう！</p>

    <div class="stamp-grid">
      <!-- スタンプ 1 -->
      <div class="stamp-card" id="card-custom1">
        <div class="stamp-img-container">
          <img id="img-card-custom1" src="" class="stamp-card-img" alt="スタンプ1">
        </div>
        <div class="stamp-name">オリジナル地点</div>
      </div>
    </div>

    <button class="btn-start" onclick="openCamera()">カメラを開く</button>
  </div>

  <!-- 2. ARカメラ画面 UI -->
  <div id="ar-ui">
    <button class="btn-back" onclick="closeCamera()">← 戻る</button>

    <!-- 円形メーター -->
    <div id="progress-container">
      <svg class="svg-meter">
        <circle class="meter-bg" cx="50" cy="50" r="45"></circle>
        <circle class="meter-bar" id="meter-bar" cx="50" cy="50" r="45"></circle>
      </svg>
      <div class="meter-text">読み込み中...</div>
    </div>
  </div>

  <!-- 3. ゲット演出（タップで消える） -->
  <div id="modal-overlay" onclick="closeModal()">
    <div class="modal-card">
      <img id="modal-img" class="modal-img" src="" alt="獲得スタンプ">
      <div class="modal-title">スタンプ GET!</div>
      <p id="modal-name" style="margin: 5px 0; font-weight: bold; color: #333;">地点名</p>
      <div class="modal-sub">画面をタップして閉じる</div>
    </div>
  </div>

  <!-- 4. AR.js WebARシーン -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- ★オリジナルマーカーを指定 (urlに.pattファイルのパスを指定) -->
    <a-marker type="pattern" url="pattern-マーカー堺.patt" id="marker-custom1">
      <a-box position="0 0.5 0" material="color: #ff9800;" scale="0.8 0.8 0.8"
             animation="property: rotation; to: 0 360 0; loop: true; dur: 3000"></a-box>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // ★★★ スタンプの設定情報 ★★★
    const STAMPS = {
      'marker-custom1': {
        id: 'custom1',
        name: 'オリジナル地点',
        // 表示したいイラスト画像のファイル名（またはURL）を指定します
        // ※自分の画像をGitHubにアップロードした場合は 'my_stamp.png' などに変更してください
        image: '古墳.png' 
      }
    };

    let myStamps = JSON.parse(localStorage.getItem('my_stamps') || '[]');

    initApp();

    function initApp() {
      // スタンプカードにイラスト画像を割り当て
      document.getElementById('img-card-custom1').src = STAMPS['marker-custom1'].image;
      updateStampCards();
    }

    function updateStampCards() {
      if (myStamps.includes('custom1')) {
        document.getElementById('card-custom1').classList.add('got');
      }
    }

    function openCamera() {
      document.getElementById('main-screen').style.display = 'none';
      document.getElementById('ar-ui').style.display = 'block';
    }

    function closeCamera() {
      document.getElementById('ar-ui').style.display = 'none';
      document.getElementById('main-screen').style.display = 'flex';
      updateStampCards();
    }

    // --- AR認識・タイマー処理 ---
    let holdTimer = null;
    let holdProgress = 0;
    const HOLD_TIME = 2000;
    const INTERVAL = 50;
    const circumference = 2 * Math.PI * 45;

    document.querySelectorAll('a-marker').forEach(marker => {
      marker.addEventListener('markerFound', () => {
        const stampInfo = STAMPS[marker.id];
        if (!stampInfo || myStamps.includes(stampInfo.id)) return;

        document.getElementById('progress-container').style.display = 'flex';
        holdProgress = 0;

        holdTimer = setInterval(() => {
          holdProgress += INTERVAL;
          const offset = circumference - (holdProgress / HOLD_TIME) * circumference;
          document.getElementById('meter-bar').style.strokeDashoffset = Math.max(0, offset);

          if (holdProgress >= HOLD_TIME) {
            clearInterval(holdTimer);
            getStamp(stampInfo);
          }
        }, INTERVAL);
      });

      marker.addEventListener('markerLost', () => {
        if (holdTimer) clearInterval(holdTimer);
        document.getElementById('progress-container').style.display = 'none';
        document.getElementById('meter-bar').style.strokeDashoffset = circumference;
      });
    });

    function getStamp(stampInfo) {
      document.getElementById('progress-container').style.display = 'none';
      document.getElementById('meter-bar').style.strokeDashoffset = circumference;

      if (!myStamps.includes(stampInfo.id)) {
        myStamps.push(stampInfo.id);
        localStorage.setItem('my_stamps', JSON.stringify(myStamps));
      }

      // 獲得ポップアップにイラスト画像と名前を自動挿入
      document.getElementById('modal-img').src = stampInfo.image;
      document.getElementById('modal-name').innerText = stampInfo.name;
      document.getElementById('modal-overlay').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal-overlay').style.display = 'none';
    }
  </script>
</body>
</html>
